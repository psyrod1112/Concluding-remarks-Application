<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>끝말잇기 - API 테스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 24px; }
  h1 { text-align: center; margin-bottom: 24px; font-size: 1.5rem; color: #94a3b8; }

  .server-bar {
    display: flex; align-items: center; gap: 12px; margin-bottom: 20px;
    background: #1e293b; padding: 12px 16px; border-radius: 8px;
  }
  .server-bar label { font-size: 0.8rem; color: #64748b; }
  .server-bar input {
    flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 6px;
    padding: 6px 10px; color: #e2e8f0; font-size: 0.85rem;
  }
  .server-bar button { white-space: nowrap; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: #1e293b; border-radius: 10px; padding: 18px;
    border: 1px solid #334155;
  }
  .card h2 { font-size: 0.95rem; font-weight: 600; margin-bottom: 14px; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 8px; }

  input[type=text], input[type=email], input[type=password], textarea {
    width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 6px;
    padding: 8px 10px; color: #e2e8f0; font-size: 0.85rem; margin-bottom: 8px;
  }
  input:focus, textarea:focus { outline: none; border-color: #6366f1; }
  textarea { resize: vertical; min-height: 60px; font-family: monospace; }

  button {
    padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.82rem; font-weight: 600; transition: opacity 0.15s;
  }
  button:hover { opacity: 0.85; }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-danger  { background: #ef4444; color: #fff; }
  .btn-warn    { background: #f59e0b; color: #000; }
  .btn-sm { padding: 5px 10px; font-size: 0.78rem; }

  .response {
    margin-top: 10px; background: #0f172a; border-radius: 6px;
    padding: 10px; font-family: monospace; font-size: 0.78rem;
    color: #94a3b8; max-height: 180px; overflow-y: auto;
    border: 1px solid #1e3a5f; white-space: pre-wrap; word-break: break-all;
  }

  /* 상태 배지 */
  .status-row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
  }
  .badge-ok   { background: #14532d; color: #4ade80; }
  .badge-fail { background: #450a0a; color: #f87171; }
  .badge-idle { background: #1e293b; color: #64748b; border: 1px solid #334155; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  /* WebSocket */
  .ws-log {
    margin-top: 10px; background: #0f172a; border-radius: 6px;
    padding: 10px; font-family: monospace; font-size: 0.78rem;
    color: #94a3b8; max-height: 160px; overflow-y: auto;
    border: 1px solid #1e3a5f;
  }
  .ws-log .recv { color: #34d399; }
  .ws-log .sent { color: #60a5fa; }
  .ws-log .sys  { color: #f59e0b; }
  .ws-log .err  { color: #f87171; }

  .session-info {
    font-size: 0.75rem; color: #64748b; margin-top: 6px; word-break: break-all;
  }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row button { white-space: nowrap; }
</style>
</head>
<body>

<h1>끝말잇기 API 테스트</h1>

<!-- 서버 주소 바 -->
<div class="server-bar">
  <label>서버 주소</label>
  <input type="text" id="baseUrl" value="http://localhost:3000">
  <button class="btn-primary btn-sm" onclick="checkHealth()">상태 확인</button>
</div>

<!-- 상태 배지 -->
<div class="status-row" id="statusRow">
  <span class="badge badge-idle"><span class="dot"></span>서버 —</span>
  <span class="badge badge-idle"><span class="dot"></span>DB —</span>
  <span class="badge badge-idle"><span class="dot"></span>Redis —</span>
</div>

<div class="grid">

  <!-- 회원가입 -->
  <div class="card">
    <h2>회원가입 POST /api/auth/register</h2>
    <input type="text"     id="reg-username" placeholder="닉네임 (2~30자)">
    <input type="email"    id="reg-email"    placeholder="이메일">
    <input type="password" id="reg-password" placeholder="비밀번호 (6자 이상)">
    <button class="btn-success" onclick="register()">회원가입</button>
    <div class="response" id="reg-resp">—</div>
  </div>

  <!-- 로그인 -->
  <div class="card">
    <h2>로그인 POST /api/auth/login</h2>
    <input type="email"    id="login-email"    placeholder="이메일">
    <input type="password" id="login-password" placeholder="비밀번호">
    <div class="row">
      <button class="btn-primary" onclick="login()">로그인</button>
      <button class="btn-danger btn-sm" onclick="clearSession()">세션 초기화</button>
    </div>
    <div class="session-info" id="session-display">저장된 세션: 없음</div>
    <div class="response" id="login-resp">—</div>
  </div>

  <!-- 내 정보 -->
  <div class="card">
    <h2>내 정보 GET /api/auth/me</h2>
    <button class="btn-primary" onclick="getMe()">내 정보 조회</button>
    <div class="response" id="me-resp">—</div>
  </div>

  <!-- 로그아웃 -->
  <div class="card">
    <h2>로그아웃 POST /api/auth/logout</h2>
    <button class="btn-warn" onclick="logout()">로그아웃</button>
    <div class="response" id="logout-resp">—</div>
  </div>

  <!-- WebSocket -->
  <div class="card" style="grid-column: 1 / -1;">
    <h2>WebSocket 테스트</h2>
    <div class="row">
      <button class="btn-success btn-sm" onclick="wsConnect()">연결</button>
      <button class="btn-danger btn-sm"  onclick="wsDisconnect()">해제</button>
      <span id="ws-status" style="font-size:0.8rem; color:#64748b; align-self:center;">● 미연결</span>
    </div>
    <div class="row" style="margin-top:8px;">
      <textarea id="ws-msg" placeholder='보낼 JSON {"type":"ping"}'></textarea>
      <button class="btn-primary btn-sm" onclick="wsSend()" style="align-self:flex-start;">전송</button>
    </div>
    <div class="ws-log" id="ws-log"><span class="sys">WebSocket 로그...</span></div>
  </div>

</div>

<script>
  // ── 유틸 ──────────────────────────────────────────────────
  const base = () => document.getElementById('baseUrl').value.replace(/\/$/, '');
  const session = () => localStorage.getItem('sessionId');

  function setResp(id, data, ok = true) {
    const el = document.getElementById(id);
    el.textContent = JSON.stringify(data, null, 2);
    el.style.color = ok ? '#94a3b8' : '#f87171';
  }

  function updateSessionDisplay() {
    const sid = session();
    document.getElementById('session-display').textContent =
      sid ? `저장된 세션: ${sid.slice(0, 8)}...` : '저장된 세션: 없음';
  }

  async function apiFetch(method, path, body, respId) {
    const headers = { 'Content-Type': 'application/json' };
    const sid = session();
    if (sid) headers['Authorization'] = `Bearer ${sid}`;
    try {
      const r = await fetch(base() + path, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
      });
      const json = await r.json();
      setResp(respId, json, r.ok);
      return { ok: r.ok, json };
    } catch (e) {
      setResp(respId, { error: e.message }, false);
      return { ok: false };
    }
  }

  // ── 헬스체크 ─────────────────────────────────────────────
  async function checkHealth() {
    const row = document.getElementById('statusRow');
    row.innerHTML = '<span class="badge badge-idle"><span class="dot"></span>확인 중...</span>';
    try {
      const r = await fetch(base() + '/health/detail');
      const d = await r.json();
      const s = (ok) => ok
        ? '<span class="badge badge-ok"><span class="dot"></span>'
        : '<span class="badge badge-fail"><span class="dot"></span>';
      row.innerHTML =
        `${s(r.ok)}서버 ${r.ok ? 'OK' : 'FAIL'}</span>` +
        `${s(d.db?.ok)}DB ${d.db?.ok ? `OK (${d.db.latencyMs}ms)` : `FAIL: ${d.db?.error ?? ''}`}</span>` +
        `${s(d.redis?.ok)}Redis ${d.redis?.ok ? `OK (${d.redis.latencyMs}ms)` : `FAIL: ${d.redis?.error ?? ''}`}</span>`;
    } catch (e) {
      row.innerHTML = `<span class="badge badge-fail"><span class="dot"></span>서버 연결 실패: ${e.message}</span>`;
    }
  }

  // ── 회원가입 ─────────────────────────────────────────────
  async function register() {
    const { ok, json } = await apiFetch('POST', '/api/auth/register', {
      username: document.getElementById('reg-username').value,
      email:    document.getElementById('reg-email').value,
      password: document.getElementById('reg-password').value,
    }, 'reg-resp');
    if (ok && json.sessionId) {
      localStorage.setItem('sessionId', json.sessionId);
      updateSessionDisplay();
    }
  }

  // ── 로그인 ───────────────────────────────────────────────
  async function login() {
    const { ok, json } = await apiFetch('POST', '/api/auth/login', {
      email:    document.getElementById('login-email').value,
      password: document.getElementById('login-password').value,
    }, 'login-resp');
    if (ok && json.sessionId) {
      localStorage.setItem('sessionId', json.sessionId);
      updateSessionDisplay();
    }
  }

  function clearSession() {
    localStorage.removeItem('sessionId');
    updateSessionDisplay();
  }

  // ── 내 정보 ──────────────────────────────────────────────
  async function getMe() {
    await apiFetch('GET', '/api/auth/me', null, 'me-resp');
  }

  // ── 로그아웃 ─────────────────────────────────────────────
  async function logout() {
    const { ok } = await apiFetch('POST', '/api/auth/logout', null, 'logout-resp');
    if (ok) {
      localStorage.removeItem('sessionId');
      updateSessionDisplay();
    }
  }

  // ── WebSocket ─────────────────────────────────────────────
  let ws = null;

  function wsLog(msg, cls = '') {
    const log = document.getElementById('ws-log');
    const line = document.createElement('div');
    line.className = cls;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  function wsConnect() {
    if (ws && ws.readyState < 2) { wsLog('이미 연결됨', 'sys'); return; }
    const url = base().replace(/^http/, 'ws');
    ws = new WebSocket(url);
    ws.onopen = () => {
      document.getElementById('ws-status').textContent = '● 연결됨';
      document.getElementById('ws-status').style.color = '#4ade80';
      wsLog('연결 성공', 'sys');
    };
    ws.onmessage = (e) => wsLog('← ' + e.data, 'recv');
    ws.onerror   = (e) => wsLog('오류 발생', 'err');
    ws.onclose   = () => {
      document.getElementById('ws-status').textContent = '● 미연결';
      document.getElementById('ws-status').style.color = '#64748b';
      wsLog('연결 종료', 'sys');
    };
  }

  function wsDisconnect() {
    if (ws) { ws.close(); ws = null; }
  }

  function wsSend() {
    const msg = document.getElementById('ws-msg').value.trim();
    if (!msg) return;
    if (!ws || ws.readyState !== 1) { wsLog('연결되지 않음', 'err'); return; }
    ws.send(msg);
    wsLog('→ ' + msg, 'sent');
  }

  // ── 초기화 ───────────────────────────────────────────────
  updateSessionDisplay();
</script>
</body>
</html>
