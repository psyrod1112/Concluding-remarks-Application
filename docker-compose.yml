services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: word_chain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tkddbs321!
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d word_chain"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: word_chain
      DB_USER: postgres
      DB_PASSWORD: tkddbs321!
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: wc_access_secret_change_in_prod_2024
      JWT_REFRESH_SECRET: wc_refresh_secret_change_in_prod_2024
      JWT_ACCESS_TTL: 900
      JWT_REFRESH_TTL: 604800
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/build/web:/usr/share/nginx/html
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
